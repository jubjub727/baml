name: Fork Windows portability validation

on:
  push:
    branches:
      - codex/validate-fix-windows-portability-canary-20260729
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
        working-directory: baml_language
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: baml_language
      - name: Test changed Rust packages
        run: cargo test --all-features -p baml_path -p baml_workspace -p baml_lsp_server -p bex_project
        working-directory: baml_language

  editor:
    name: Editor paths and lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          package_json_file: typescript2/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript2/pnpm-lock.yaml
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: typescript2
      - name: Run editor path tests
        run: pnpm --filter @b/pkg-editor test
        working-directory: typescript2
